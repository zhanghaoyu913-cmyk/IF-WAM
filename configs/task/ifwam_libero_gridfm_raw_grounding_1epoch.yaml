# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam
  - _self_

batch_size: 2
num_workers: 8
learning_rate: 2.0e-5
num_epochs: 1
max_steps: 8679
log_every: 10
save_every: 0
save_weights_every: 0
save_state_every: 0
save_final_state: false
eval_every: 0
gradient_accumulation_steps: 4
expected_global_batch_size: 32
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler_type: cosine
mixed_precision: bf16
seed: 0
resume: null
wandb:
  enabled: false
  project: if-wam
  group: gridfm-raw-grounding-1epoch
  mode: online
  core_metrics_only: false

model:
  mot_checkpoint_mixed_attn: true
  action_dit_pretrained_path: /2024233240/FastWAM/checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  skip_dit_load_from_pretrain: false
  loss:
    lambda_action: 1.0

data:
  train:
    dataset_dirs:
      - /2024233240/sim_data/fastwam/data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot
      - /2024233240/sim_data/fastwam/data/libero_mujoco3.3.2/libero_object_no_noops_lerobot
      - /2024233240/sim_data/fastwam/data/libero_mujoco3.3.2/libero_goal_no_noops_lerobot
      - /2024233240/sim_data/fastwam/data/libero_mujoco3.3.2/libero_10_no_noops_lerobot
    text_embedding_cache_dir: /2024233240/if-wam_incoming/ifwam_data/text_embeds_cache
    pretrained_norm_stats: /2024233240/FastWAM/checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [224, 448]
    processor:
      num_output_cameras: 2
