# @package _global_
defaults:
  - override /data: ifwam_mixed
  - override /model: ifwam_fastwam
  - override /ifwam: default
  - _self_

batch_size: 2
num_workers: 4
learning_rate: 1.0e-4
num_epochs: 1
max_steps: 20000
log_every: 10
save_every: 0
save_weights_every: 0
save_state_every: 0
save_final_state: false
eval_every: 0
gradient_accumulation_steps: 4
expected_global_batch_size: 32
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler_type: cosine
mixed_precision: bf16
seed: 0
resume: null
wandb:
  enabled: false
  project: if-wam
  group: current-subsampled-three-way
  mode: online
  core_metrics_only: false

model:
  loss:
    lambda_action: 1.0
  ifwam:
    enabled: false

ifwam:
  ifwam:
    enabled: false

data:
  train:
    manifest_path: /2024233240/if-wam_incoming/ifwam_data/manifests/dense_ablation/train_libero_dense_f4_s1_nogrid.jsonl
    enable_gridflow_teacher: false
    image_size: [224, 224]
    camera_mode: concat
    num_video_frames: 9
    num_action_steps: 32
    num_flow_windows: 2
    action_dim: 7
    state_dim: 0
    proprio_dim: 8
    grid_size: [8, 8]
    text_embedding_cache_dir: /2024233240/if-wam_incoming/ifwam_data/text_embeds_cache
    context_len: 128
    context_dim: 4096
    layout_homogeneous_batches: true
    sampler_group_sampling: proportional_to_num_rows
    sampler_shuffle: true
    sampler_drop_last: true
